; Hard Truck SkoFix settings. Changes take effect the next time the game starts.
; Unless a comment says otherwise, 1 is on and 0 is off.

[Graphics]
; Shape of the picture in accelerator mode: Auto = like your screen, 4:3 = original,
; or another between 4:3 and 32:9, for example 16:9. A wider picture shows more of the road
Aspect=Auto
; Resolution in accelerator mode: Auto = at least that of your screen, or for example 1920x1080
; (then Aspect is not used). Off = leave dgVoodoo.conf as it is
Resolution=Auto
; Frames per second, 10 to 200. 0 = the game's own pace
MaxFps=60
; Do not also wait for the screen when MaxFps sets the pace (needs MaxFps above 0). 0 = original
NoVsyncWait=1
; Accept graphics cards with 2 GB of memory or more
VideoMemoryCheck=1
; Test the accelerator again if an earlier test failed (needs VideoMemoryCheck=1)
RetestAccelerator=1

[Disc]
; Play without the game disc. Needs the Maximum installation or a folder copied from the disc
NoDisc=1
; If the disc is inserted, find it in any drive
FindDisc=1
; Run a game folder that was copied from the disc without its installer
RunWithoutSetup=1

[General]
; Precise clock that starts with the game. Fixes the crash when a drive starts. Leave this on
Clock=1
; Stop drawing rooms within rooms before the game runs out of space for them. Leave this on
PortalCheck=1
; Write HardTruck.SkoFix.log
Log=1
; Add a line with the frame rate to the log every ten seconds
Diagnostics=0
